<!doctype html>
<html lang="en" class="bg-slate-950 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BBL DM System</title>
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'%3E%3C/path%3E%3Cpolyline points='3.27 6.96 12 12.01 20.73 6.96'%3E%3C/polyline%3E%3Cline x1='12' y1='22.08' x2='12' y2='12'%3E%3C/line%3E%3C/svg%3E" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('appSettings');
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed && parsed.appLogo) {
              var favicon = document.getElementById('app-favicon');
              if (favicon) favicon.href = parsed.appLogo;
            }
            if (parsed && parsed.appName) {
              document.title = parsed.appName;
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root" class="bg-slate-950 min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
